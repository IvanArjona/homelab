http:
  middlewares:
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        trustForwardHeader: true
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Name
          - Remote-Email

  routers:
    authelia:
      rule: Host(`auth.{{ env "DOMAIN" }}`)
      entryPoints:
        - websecure
      service: authelia@docker
      tls:
        certResolver: resolver
