- Networking:
    - Traefik:
        icon: traefik.png
        href: https://traefik.{{HOMEPAGE_VAR_DOMAIN}}
        description: Reverse proxy
        server: docker
        container: traefik
        widget:
          type: traefik
          url: http://traefik:8080
    - Pi-hole:
        icon: pi-hole.png
        href: https://pihole.{{HOMEPAGE_VAR_DOMAIN}}/admin/
        description: DNS server
        server: docker
        container: pihole
        widget:
          type: pihole
          url: http://pihole
          key: "{{HOMEPAGE_VAR_PIHOLE_PASSWORD}}"
          version: 6
    - Authelia:
        icon: authelia.png
        href: https://auth.{{HOMEPAGE_VAR_DOMAIN}}
        description: Authentication portal
        server: docker
        container: authelia
        ping: http://authelia:9091
    - WireGuard:
        icon: wireguard.png
        href: https://wireguard.{{HOMEPAGE_VAR_DOMAIN}}
        description: VPN server
        server: docker
        container: wireguard
        widget:
          type: wgeasy
          url: http://wireguard:51821
          version: 2
          username: "{{HOMEPAGE_VAR_WIREGUARD_USER}}"
          password: "{{HOMEPAGE_VAR_WIREGUARD_PASSWORD}}"

