x-env: &env
  PUID: ${PUID}
  GUID: ${GUID}
  TZ: ${TZ}

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3

x-base: &base
  restart: unless-stopped
  environment: *env
  user: ${PUID}:${GUID}
  dns:
    - ${PIHOLE_IP}
    - 1.1.1.1
    - 1.0.0.1
  networks:
    homelab:

x-volumes:
  media: &media /data/media:/data/media
  torrents: &torrents /data/torrents:/data/torrents
  data: &data /data:/data

services:
  dockerproxy:
    <<: *base
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    user: root
    environment:
      <<: *env
      CONTAINERS: 1 # Allow access to viewing containers
      INFO: 1 # Allow access to Docker info
    ports:
      - 127.0.0.1:2375:2375
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]

  traefik:
    <<: *base
    image: traefik:v3
    container_name: traefik
    user: root
    depends_on:
      dockerproxy:
        condition: service_healthy
    command:
      - --api.insecure=true
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.endpoint=tcp://dockerproxy:2375
      - --entryPoints.web.address=:80
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=resolver
      - --entrypoints.websecure.asDefault=true
      - --certificatesresolvers.resolver.acme.dnschallenge=true
      - --certificatesresolvers.resolver.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.resolver.acme.email=postmaster@${DOMAIN}
      - --certificatesresolvers.resolver.acme.storage=/letsencrypt/acme.json
    environment:
      <<: *env
      CF_DNS_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
    ports:
      - 80:80
      - 443:443
    volumes:
      - letsencrypt:/letsencrypt
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.${DOMAIN}`)
      - traefik.http.services.traefik.loadbalancer.server.port=8080
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  cloudflareddns:
    <<: *base
    image: favonia/cloudflare-ddns:latest
    container_name: cloudflareddns
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      <<: *env
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_DNS_API_TOKEN}
      DOMAINS: ${PUBLIC_DOMAIN}
      PROXIED: false

  watchtower:
    <<: *base
    image: nickfedor/watchtower:latest
    container_name: watchtower
    user: ${PUID}:${DOCKER_GUID}
    depends_on:
      dockerproxy:
        condition: service_started
    environment:
      <<: *env
      WATCHTOWER_POLL_INTERVAL: 10800
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_TIMEOUT: 30s
      WATCHTOWER_NO_STARTUP_MESSAGE: true
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL}
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_API_TOKEN}
      WATCHTOWER_HTTP_API_METRICS: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  homepage:
    <<: *base
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    depends_on:
      dockerproxy:
        condition: service_healthy
    volumes:
      - ./homepage:/app/config
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${DOMAIN}
      HOMEPAGE_VAR_DOMAIN: ${DOMAIN}
      HOMEPAGE_VAR_PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      HOMEPAGE_VAR_WIREGUARD_USER: ${WIREGUARD_USER}
      HOMEPAGE_VAR_WIREGUARD_PASSWORD: ${WIREGUARD_PASSWORD}
      HOMEPAGE_VAR_JELLYFIN_API_KEY: ${JELLYFIN_API_KEY}
      HOMEPAGE_VAR_SONARR_API_KEY: ${SONARR_API_KEY}
      HOMEPAGE_VAR_RADARR_API_KEY: ${RADARR_API_KEY}
      HOMEPAGE_VAR_SEERR_API_KEY: ${SEERR_API_KEY}
      HOMEPAGE_VAR_BAZARR_API_KEY: ${BAZARR_API_KEY}
      HOMEPAGE_VAR_JACKETT_PASSWORD: ${JACKETT_PASSWORD}
      HOMEPAGE_VAR_QBITTORRENT_USERNAME: ${QBITTORRENT_USERNAME}
      HOMEPAGE_VAR_QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      HOMEPAGE_VAR_CHANGEDETECTION_API_KEY: ${CHANGEDETECTION_API_KEY}
      HOMEPAGE_VAR_WATCHTOWER_API_TOKEN: ${WATCHTOWER_API_TOKEN}
      HOMEPAGE_VAR_GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      HOMEPAGE_VAR_GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`${DOMAIN}`)
      - traefik.http.services.homepage.loadbalancer.server.port=3000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]

  warp:
    <<: *base
    image: caomingjun/warp:latest
    container_name: warp
    device_cgroup_rules:
      - "c 10:200 rwm"
    cap_add:
      - MKNOD
      - AUDIT_WRITE
      - NET_ADMIN
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./warp:/etc/warp

  pihole:
    <<: *base
    container_name: pihole
    image: pihole/pihole:latest
    user: root
    ports:
      - 53:53/tcp
      - 53:53/udp
    environment:
      <<: *env
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: all
      FTLCONF_dns_upstreams: 1.1.1.1;1.0.0.1
      PIHOLE_UID: ${PUID}
      PIHOLE_GID: ${GUID}
    volumes:
      - ./pihole:/etc/pihole
    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE
    dns:
      - 1.1.1.1
      - 1.0.0.1
    networks:
      homelab:
        ipv4_address: ${PIHOLE_IP}
    labels:
      - traefik.enable=true
      - traefik.http.routers.pihole.rule=Host(`pihole.${DOMAIN}`)
      - traefik.http.services.pihole.loadbalancer.server.port=80
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "dig", "+short", "+time=2", "+tries=1", "@127.0.0.1", "healthcheck.pi-hole.net"]

  wireguard:
    <<: *base
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wireguard
    user: root
    environment:
      <<: *env
      INIT_ENABLED: true
      INIT_HOST: ${PUBLIC_DOMAIN}
      INIT_PORT: 51820
      INIT_USERNAME: ${WIREGUARD_USER}
      INIT_PASSWORD: ${WIREGUARD_PASSWORD}
      INIT_DNS: ${PIHOLE_IP}
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    volumes:
      - ./wireguard:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.wireguard.rule=Host(`wireguard.${DOMAIN}`)
      - traefik.http.services.wireguard.loadbalancer.server.port=51821
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://0.0.0.0:51821"]

  jellyfin:
    <<: *base
    container_name: jellyfin
    image: jellyfin/jellyfin:latest
    user: "${PUID}:${RENDER_GUID}"
    environment:
      <<: *env
      JELLYFIN_PublishedServerUrl: https://jellyfin.${DOMAIN}
    ports:
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - ./jellyfin:/config
      - *media
    devices:
      - /dev/dri:/dev/dri
    labels:
      - traefik.enable=true
      - traefik.http.routers.jellyfin.rule=Host(`jellyfin.${DOMAIN}`)
      - traefik.http.services.jellyfin.loadbalancer.server.port=8096
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      timeout: 10s

  sonarr:
    <<: *base
    container_name: sonarr
    image: ghcr.io/linuxserver/sonarr:latest
    volumes:
      - ./sonarr:/config
      - *data
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)
      - traefik.http.services.sonarr.loadbalancer.server.port=8989
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8989/ping"]

  radarr:
    <<: *base
    container_name: radarr
    image: ghcr.io/linuxserver/radarr:latest
    volumes:
      - ./radarr:/config
      - *data
    labels:
      - traefik.enable=true
      - traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)
      - traefik.http.services.radarr.loadbalancer.server.port=7878
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:7878/ping"]

  recyclarr:
    <<: *base
    container_name: recyclarr
    image: ghcr.io/recyclarr/recyclarr:8
    environment:
      <<: *env
      SONARR_API_KEY: ${SONARR_API_KEY}
      RADARR_API_KEY: ${RADARR_API_KEY}
    read_only: true
    tmpfs: /tmp
    security_opt: [no-new-privileges:true]
    volumes:
      - ./recyclarr:/config

  bazarr:
    <<: *base
    container_name: bazarr
    image: ghcr.io/linuxserver/bazarr:latest
    volumes:
      - ./bazarr:/config
      - *media
    labels:
      - traefik.enable=true
      - traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)
      - traefik.http.services.bazarr.loadbalancer.server.port=6767
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:6767/ping"]

  cleanuparr:
    <<: *base
    container_name: cleanuparr
    image: ghcr.io/cleanuparr/cleanuparr:latest
    user: root
    volumes:
      - ./cleanuparr:/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.cleanuparr.rule=Host(`cleanuparr.${DOMAIN}`)
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:11011"]

  seerr:
    <<: *base
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    volumes:
      - ./seerr:/app/config
    labels:
      - traefik.enable=true
      - traefik.http.routers.seerr.rule=Host(`seerr.${DOMAIN}`)
      - traefik.http.services.seerr.loadbalancer.server.port=5055
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5055/api/v1/status"]

  jackett:
    <<: *base
    container_name: jackett
    image: ghcr.io/linuxserver/jackett:latest
    volumes:
      - ./jackett:/config
      - *torrents
    labels:
      - traefik.enable=true
      - traefik.http.routers.jackett.rule=Host(`jackett.${DOMAIN}`)
      - traefik.http.services.jackett.loadbalancer.server.port=9117
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:9117/UI/Dashboard"]

  flaresolverr:
    <<: *base
    container_name: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr:latest
    labels:
      - traefik.enable=true
      - traefik.http.routers.flaresolverr.rule=Host(`flaresolverr.${DOMAIN}`)
      - traefik.http.services.flaresolverr.loadbalancer.server.port=8191
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8191/health"]

  qbittorrent:
    <<: *base
    container_name: qbittorrent
    image: ghcr.io/linuxserver/qbittorrent:latest
    ports:
      - 6881:6881/tcp
      - 6881:6881/udp
    volumes:
      - ./qbittorrent:/config
      - *torrents
      - *media
    labels:
      - traefik.enable=true
      - traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)
      - traefik.http.services.qbittorrent.loadbalancer.server.port=8080
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080"]

  browserless:
    <<: *base
    container_name: browserless
    image: ghcr.io/browserless/chromium:latest
    user: root
    shm_size: 2gb
    environment:
      <<: *env
      TOKEN: ${BROWSERLESS_CHROMIUM_TOKEN}
      TIMEOUT: 60000
      CORS: true
      CONCURRENT: 10
    labels:
      - traefik.enable=true
      - traefik.http.routers.browserless.rule=Host(`browserless.${DOMAIN}`)
      - traefik.http.services.browserless.loadbalancer.server.port=3000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/active?token=${BROWSERLESS_CHROMIUM_TOKEN}"]
      start_period: 30s

  changedetection:
    <<: *base
    container_name: changedetection
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    environment:
      <<: *env
      BASE_URL: https://changedetection.${DOMAIN}
      DISABLE_VERSION_CHECK: true
      PLAYWRIGHT_DRIVER_URL: ${PLAYWRIGHT_DRIVER_URL}
    volumes:
      - ./changedetection/config:/config
      - ./changedetection/datastore:/datastore
    depends_on:
      browserless:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.changedetection.rule=Host(`changedetection.${DOMAIN}`)
      - traefik.http.services.changedetection.loadbalancer.server.port=5000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      start_period: 30s

  samba:
    <<: *base
    container_name: samba
    image: dperson/samba:latest
    user: root
    ports:
      - 137:137/udp
      - 138:138/udp
      - 139:139/tcp
      - 445:445/tcp
    environment:
      <<: *env
      USERID: ${PUID}
      GROUPID: ${GUID}
    volumes:
      - /data:/data:z
      - .:/home:z
    tmpfs:
      - /tmp
    command: '-s "data;/data;;no" -s "home;/home;;no" -u "${SAMBA_USER};${SAMBA_PASSWORD}" -p -n -r'

  filebrowser:
    <<: *base
    container_name: filebrowser
    image: gtstef/filebrowser:latest
    environment:
      <<: *env
      FILEBROWSER_CONFIG: data/config.yaml
      FILEBROWSER_ADMIN_PASSWORD: ${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ./filebrowser:/home/filebrowser/data
      - /data:/data:z
      - .:/homelab:z
    labels:
      - traefik.enable=true
      - traefik.http.routers.filebrowser.rule=Host(`filebrowser.${DOMAIN}`)
      - traefik.http.services.filebrowser.loadbalancer.server.port=80
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/health"]

  n8n:
    <<: *base
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:latest
    user: node:${DOCKER_GUID}
    environment:
      <<: *env
      N8N_HOST: n8n.${DOMAIN}
      N8N_PROTOCOL: https
      N8N_RUNNERS_ENABLED: true
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      GENERIC_TIMEZONE: ${TZ}
      NODES_EXCLUDE: "[]"
    ports:
      - 5678:5678
    volumes:
      - ./n8n:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)
      - traefik.http.services.n8n.loadbalancer.server.port=5678
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]

  influxdb:
    <<: *base
    container_name: influxdb
    image: influxdb:latest
    volumes:
      - ./influxdb:/var/lib/influxdb2
    labels:
      - traefik.enable=true
      - traefik.http.routers.influxdb.rule=Host(`influxdb.${DOMAIN}`)
      - traefik.http.services.influxdb.loadbalancer.server.port=8086
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]

  telegraf:
    <<: *base
    container_name: telegraf
    image: telegraf:latest
    user: telegraf:${DOCKER_GUID}
    depends_on:
      influxdb:
        condition: service_healthy
      dockerproxy:
        condition: service_healthy
    environment:
      <<: *env
      INFLUXDB_ORGANIZATION: ${INFLUXDB_ORGANIZATION}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_API_TOKEN: ${INFLUXDB_API_TOKEN}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro

  grafana:
    <<: *base
    container_name: grafana
    image: grafana/grafana:latest
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      <<: *env
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana:/var/lib/grafana
    labels:
      - traefik.enable=true
      - traefik.http.routers.grafana.rule=Host(`grafana.${DOMAIN}`)
      - traefik.http.services.grafana.loadbalancer.server.port=3000
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]

  duplicati:
    <<: *base
    container_name: duplicati
    image: lscr.io/linuxserver/duplicati:latest
    user: root
    environment:
      <<: *env
      SETTINGS_ENCRYPTION_KEY: ${DUPLICATI_ENCRYPTION_KEY}
      DUPLICATI__WEBSERVICE_PASSWORD: ${DUPLICATI_PASSWORD}
    volumes:
      - ./duplicati/config:/config
      - ./:/homelab:z
    ports:
      - 8200:8200
    labels:
      - traefik.enable=true
      - traefik.http.routers.duplicati.rule=Host(`duplicati.${DOMAIN}`)
      - traefik.http.services.duplicati.loadbalancer.server.port=8200
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8200"]

volumes:
  letsencrypt:

networks:
  homelab:
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}
        - subnet: fdcc:ad94:bacf:61a3::/64
    enable_ipv6: true
